name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ matrix.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ matrix.os }}-spm-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
