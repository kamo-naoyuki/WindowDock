name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        env:
          ARCHS: --arch arm64 --arch x86_64
        run: |
          VERSION="${GITHUB_REF_NAME#v}" bash build-app.sh
          lipo -info dist/WindowDock.app/Contents/MacOS/WindowDock
      - name: Package
        run: |
          bash build-dmg.sh "${GITHUB_REF_NAME}"
          ditto -c -k --keepParent dist/WindowDock.app "dist/WindowDock-${GITHUB_REF_NAME}.zip"
      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="dist/WindowDock-${GITHUB_REF_NAME}.zip"
          sig="$(echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$zip")"
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>WindowDock</title>
              <item>
                <title>${version}</title>
                <sparkle:version>${version}</sparkle:version>
                <sparkle:shortVersionString>${version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <enclosure url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/WindowDock-${GITHUB_REF_NAME}.zip" type="application/octet-stream" ${sig} />
              </item>
            </channel>
          </rss>
          XML
          cat dist/appcast.xml
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.xml
          generate_release_notes: true
